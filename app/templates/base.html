<!doctype html>
<html lang="en">
<head>
  <script>
    // Apply saved theme BEFORE the CSS parses so there's no flash.
    (function() {
      try {
        var t = localStorage.getItem('resumeai-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResumeAI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="top">
    <div class="inner">
      <a href="/" class="brand">Resume<span class="dot">.</span>AI</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/admin">Screen</a></li>
        <li><a href="/compare">Compare</a></li>
      </ul>
      <div style="display:flex; align-items:center; gap:14px;">
        <button type="button" class="theme-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle light / dark">
          <span class="icon-light">☀</span><span class="icon-dark">☾</span>
        </button>
        {% if is_admin %}
        <form method="post" action="/logout" style="margin:0"><button type="submit" class="cta" style="border:0; font-family:inherit; cursor:pointer">Sign out</button></form>
        {% else %}
        <a href="/login" class="cta">Admin sign in →</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div class="container">
      <div class="brand-mini">Resume<span style="color:var(--accent)">.</span>AI</div>
      <div class="foot-note">MiniLM · FAISS · Cross-Encoder · Group 29 · K.J. Somaiya</div>
      <div class="copy">© 2026 · Final Year Project</div>
    </div>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
